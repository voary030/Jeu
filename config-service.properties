# Configuration du service ConfigService
# Ce fichier peut être utilisé pour configurer l'URL et autres paramètres

# URL de la microservice ConfigService
config.service.url=http://localhost:8080/config-service/api/config

# Timeout de connexion (en millisecondes)
config.service.timeout=5000

# Activer/désactiver l'utilisation du service (true/false)
config.service.enabled=true

# Mode fallback automatique (true/false)
# Si true, bascule automatiquement sur fichiers CSV si le service est indisponible
config.service.fallback.enabled=true

# Chemin des fichiers CSV de secours
config.file.board=/config/board_config.csv
config.file.pieces=/config/piece_health_config.csv
